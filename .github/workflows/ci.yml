name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs strictly from package-lock.json, so CI fails loudly
      # if the lockfile and package.json ever drift apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the calculation engine: Epley and its rep cap, volume with
      # warm-up exclusion, PR detection, the recovery estimate, all five
      # load-recommendation branches, readiness bounds, and the determinism
      # of the 8-week seed generator.
      - name: Test
        run: npm test -- --ci
