name: CI

# WHY `pull_request` HAS NO BRANCH FILTER
# ---------------------------------------
# It used to be `branches: [main]`, which meant a pull request targeting any
# other branch never ran CI at all. That is not a hypothetical gap: a six-PR
# stack (#47-#52) each reported "clean" on GitHub having never been tested,
# `main` sat red for hours behind them, and the merges went ahead on evidence
# that did not exist. A check that cannot run is worse than no check, because
# it reads as a pass.
#
# Stacked pull requests are the normal shape of work here (one sprint, one
# branch, per `Docs/invariants.md` I-14), so "targets main" was never a good
# proxy for "worth testing".
#
# The cost is nil: this repository is public, so GitHub-hosted runners are
# free, and a run takes about 45 seconds. The `concurrency` block below already
# cancels superseded runs, so a branch pushed repeatedly does not queue up.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Kept in step with `.nvmrc`, which is the version a developer's shell
      # picks up. These drifting apart is not a theoretical problem: CI ran
      # Node 20 while local development ran Node 22, `main` went red on a
      # global that exists in one and not the other, and every local run said
      # green. Change one of these two and change the other.
      #
      # Node 20 reached end-of-life in April 2026, so CI was also running an
      # unsupported runtime that no longer receives security patches.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from package-lock.json, so CI fails loudly
      # if the lockfile and package.json ever drift apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the calculation engine: Epley and its rep cap, volume with
      # warm-up exclusion, PR detection, the recovery estimate, all five
      # load-recommendation branches, readiness bounds, and the determinism
      # of the 8-week seed generator.
      - name: Test
        run: npm test -- --ci

  rls:
    name: RLS isolation suite
    runs-on: ubuntu-latest

    # A disposable Postgres for this job only -- torn down when the job ends.
    # No real Supabase project is touched; supabase/tests/rls/00_setup_auth_emulation.sql
    # reconstructs just enough of Supabase's auth schema/roles against plain
    # Postgres to exercise the RLS policies faithfully. Pinned to the same
    # Postgres 16 used in this suite's own disposable-instance verification
    # (Docs/sprints/2026-08-01-rls-migration-fix.md), not tied to any
    # particular hosted project's version.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest already ships psql (postgresql-client-16 is a hard
      # dependency of the PostgreSQL 16 the runner image documents as
      # pre-installed), but installing it explicitly here means this job does
      # not depend on that staying true if GitHub's runner image changes.
      - name: Install postgresql-client-16
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16

      # Applies both migrations plus the auth-emulation and isolation-assertion
      # suite in supabase/tests/rls/ against the disposable Postgres above.
      # supabase/tests/rls/run.sh already exits non-zero on the first SQL
      # error (set -euo pipefail, ON_ERROR_STOP=1 per psql call).
      - name: Run RLS isolation suite
        env:
          PSQL_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/rls/run.sh
